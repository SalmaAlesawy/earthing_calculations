name: earthing_calc
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  build_runner: ^2.12.0
  flutter_gen_runner:
  flutter_svg: ^2.3.0
  flutter_bloc: ^9.1.1
  easy_stepper: ^1.2.0
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  intl: ^0.20.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/bahra_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#E53935"
  adaptive_icon_foreground: "assets/images/bahra_logo.png"

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
     - family: inter
       fonts:
         - asset: assets/fonts/Inter_18pt-Medium.ttf
           weight: 500
         - asset: assets/fonts/Inter_18pt-Regular.ttf
           weight: 400
         - asset: assets/fonts/Inter_18pt-SemiBold.ttf
           weight: 700

  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter_gen:
  output: lib/core/gen/ # Optional (default: lib/gen/)
  # line_length: 80 # Optional

  # Optional
  integrations:
    image: true
    flutter_svg: true